name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      TYPESAFE_API_KEY: ""
      JEV_GOVERNOR_JEV_ENABLED: "false"
      JEV_GOVERNOR_LIVE_MAX_ATTEMPTS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Tests (provider traffic blocked)
        run: pytest tests -q
      - name: Offline demo smoke
        run: |
          python -m jev_governor demo --no-verify-flow > demo.log
          python -m jev_governor jev-smoke --json
          python -m jev_governor codex-qualify --json
